# NEOWATCH with Docker: `cp .env.example .env`, set JWT_SECRET (e.g. `openssl rand -base64 48`),
# then `docker compose up --build -d`. Accounts and the catalog cache live in named volumes.
services:
  neowatch:
    build: .
    image: neowatch:latest
    container_name: neowatch
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    # Every other setting (REQUIRE_AUTH, ADMIN_EMAIL, ADMIN_PASSWORD, TRUST_PROXY, Stripe...)
    # comes from .env when it exists.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      # Fail fast with a clear message instead of a container that exits and restarts forever.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (a long random string, e.g. openssl rand -base64 48)}
      # Pinned to the volumes below, whatever .env says for a local run.
      DATA_DIR: /app/server/.data
      CACHE_DIR: /app/server/.cache
    volumes:
      - neowatch-cache:/app/server/.cache
      - neowatch-data:/app/server/.data

volumes:
  neowatch-cache:
  neowatch-data:
