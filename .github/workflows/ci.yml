name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: the workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # 20.20.2, the production Node (undici must stay on 6)
          cache: npm

      - name: Install
        run: npm ci

      - name: undici is on major 6 (Node 20 in production)
        run: node -e "const v=require('undici/package.json').version; console.log('undici', v); if (v.split('.')[0] !== '6') process.exit(1)"
        working-directory: server

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Build (web)
        run: npm run build

      - name: i18n keys (every t() key exists in EN, FR and RU)
        # --tokens compares with Sentinel House charte.css, which is not in this repo: local only.
        run: node test/verify-design.mjs --keys

      - name: Server suites (contract, integration, proxy, img, account, catalog, hardening, session)
        run: npm test

      - name: Dependency audit (production deps, high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: No em dash in tracked files
        run: |
          if git grep -nI $'\u2014' -- . ; then echo "Use -- instead of an em dash"; exit 1; fi
